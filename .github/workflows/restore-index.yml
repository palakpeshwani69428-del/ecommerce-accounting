name: restore-index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check payload
        id: g
        run: |
          if [ -f .deploy/index.html.xz.b64 ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build index.html
        if: steps.g.outputs.ok == '1'
        run: |
          base64 -d .deploy/index.html.xz.b64 | xz -d > index.html
          test "$(wc -c < index.html)" -eq 88252
          test "$(git hash-object index.html)" = "a9421f1e4997951a982cf1663e0fc1c907f16edc"
          echo "verified: byte-exact index.html"
      - name: Commit and remove payload
        if: steps.g.outputs.ok == '1'
        run: |
          git config user.name "accounting-assistant[bot]"
          git config user.email "accounting-assistant@users.noreply.github.com"
          git rm .deploy/index.html.xz.b64
          git add index.html
          git commit -m "chore: materialise byte-exact index.html (88,252 bytes) from compressed source"
          git push
